# TeamoRouter 本机中转 —— 只为本机 API 网关服务
# 由来：api.teamorouter.com 的 TLS 握手在进入本机时被按域名重置（SNI 一出现就断），
#       而同一 IP 不报域名则正常应答。nginx 对上游默认不发 SNI，正好走通这条路。
# 边界：只监听 127.0.0.1，外部访问不到；只转发 /v1/ 前缀，其余一律 404。
# 回滚：rm -f /etc/nginx/conf.d/teamo-relay.conf && nginx -t && systemctl reload nginx
server {
    listen 127.0.0.1:8471;
    server_name teamo-relay.invalid;

    access_log /var/log/nginx/teamo-relay.access.log;
    error_log  /var/log/nginx/teamo-relay.error.log warn;

    allow 127.0.0.1;
    deny  all;

    location /v1/ {
        proxy_pass https://api.teamorouter.com;
        proxy_ssl_server_name off;
        proxy_set_header Host api.teamorouter.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_name api.teamorouter.com;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    location / { return 404; }
}
