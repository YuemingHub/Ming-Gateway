# =============================================================================
# 统一 API 网关 —— 配置模板
#
# 复制为 gateway.yaml 后修改。支持 ${ENV_VAR} 与 ${ENV_VAR:默认值} 展开，
# 建议把真实 Key 放在环境变量里，避免明文入库。
#
# 三组约定：
#   A 稳定开发组   日常主力，性价比优先，多渠道互备，故障自动切换
#   B 免费消耗组   免费/极低成本，作为 A 组全挂时的兜底
#   C 高配置组     昂贵模型，严格控本；默认不会被动进入，必须显式指定
#
# 显式指定 C 组的两种方式：
#   1) 请求头  X-GW-Group: C
#   2) 模型前缀 c:gpt-4o        （同样支持 a: / b: 前缀强制指定组）
# =============================================================================

server:
  host: 127.0.0.1          # 生产环境改 0.0.0.0，配合反代或防火墙使用
  port: 8787
  adminToken: ""           # 管理接口令牌；留空则只允许 127.0.0.1 访问管理面
  requestTimeoutMs: 300000 # 单次上游请求超时（5 分钟，兼容长思考模型）
  connectTimeoutMs: 10000
  maxRetries: 2            # 单请求最多切换渠道的次数
  retryOnStatus: [408, 409, 429, 500, 502, 503, 504]
  maxBodyBytes: 16777216   # 单请求体上限（字节），默认 16MB，超限返回 413
  logLevel: info           # error | warn | info | debug
  dataDir: ./data          # 用量日志落盘目录
  # 流式请求自动注入 stream_options.include_usage，用于准确统计 token
  # 关掉可省一次请求体重序列化，但流式请求将统计不到用量
  injectStreamUsage: true

# 全局响应缓存（仅对非流式且 temperature=0 的请求生效）
cache:
  enabled: true
  ttlSec: 600
  maxEntries: 2000
  onlyDeterministic: true

# 降级策略
fallback:
  enabled: true
  chain: [A, B]            # A 全挂 → 降级 B；C 永不自动进入
  crossGroup: true

# -----------------------------------------------------------------------------
# 分组定义
# -----------------------------------------------------------------------------
groups:
  A:
    name: 稳定开发组
    desc: 日常开发主力，性价比优先，多渠道互备
    fallbackTo: [B]
    requireExplicit: false
    limits:
      rpm: 0               # 0 = 不限流
      tpm: 0
      concurrency: 0
    cache:
      enabled: false

  B:
    name: 免费消耗组
    desc: 免费或极低成本，A 组故障时的兜底
    fallbackTo: []
    requireExplicit: false
    limits:
      rpm: 0
      tpm: 0
      concurrency: 0
    cache:
      enabled: true        # 免费组随便缓存，能省则省
      ttlSec: 3600

  C:
    name: 高配置组
    desc: 昂贵/高配模型，严格控本，永不自动进入
    fallbackTo: []
    requireExplicit: true # 关键：只能通过 X-GW-Group: C 或 c: 前缀进入
    limits:
      rpm: 20              # 高配组默认限速，防止脚本失控
      tpm: 200000
      concurrency: 4
    budget:
      dailyUSD: 5          # 今日预算上限，达到后直接 429 熔断
      monthlyUSD: 60
      warnRatio: 0.8
    cache:
      enabled: true        # 高配组强制缓存，重复问题零成本
      ttlSec: 7200

# -----------------------------------------------------------------------------
# 渠道列表
#
# 字段说明：
#   id        唯一标识（状态页显示）
#   group     A / B / C
#   provider  协议类型：openai（含绝大多数国产兼容）/ anthropic / gemini
#   plan      standard | coding | agent | free —— 用于区分套餐类型，方便统计
#   baseUrl   上游地址，写到 /v1 这一级即可
#   models    该渠道支持的模型，留空 = 全部；支持通配符如 glm-*
#   weight    同优先级内的权重，越大越容易被选中
#   priority  数字越小越优先；同组内先挑小 priority 的渠道
#   limits.windowSec / windowMaxRequests
#             套餐配额窗口，典型用途是 coding plan 的「5 小时 N 次」限制
# -----------------------------------------------------------------------------
channels:

  # ---------------- A 组：稳定开发 ----------------
  - id: deepseek-main
    name: DeepSeek 主账号
    group: A
    provider: openai
    plan: standard
    baseUrl: https://api.deepseek.com/v1
    apiKey: ${DEEPSEEK_API_KEY}
    models: [deepseek-chat, deepseek-reasoner]
    weight: 100
    priority: 10
    enabled: true
    cooldown:
      baseSec: 60
      maxSec: 900
      failThreshold: 3

  - id: glm-standard
    name: 智谱 GLM 标准
    group: A
    provider: openai
    plan: standard
    baseUrl: https://open.bigmodel.cn/api/paas/v4
    apiKey: ${GLM_API_KEY}
    models: [glm-4.6, glm-4.5, glm-4.5-air, glm-4-plus, glm-4-air, glm-4-flash]
    weight: 80
    priority: 20
    enabled: true

  - id: qwen-main
    name: 通义千问
    group: A
    provider: openai
    plan: standard
    baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
    apiKey: ${QWEN_API_KEY}
    models: [qwen-max, qwen-plus, qwen-turbo, qwen3-235b-a22b, qwen3-32b]
    weight: 80
    priority: 20
    enabled: true

  - id: doubao-main
    name: 字节豆包
    group: A
    provider: openai
    plan: standard
    baseUrl: https://ark.cn-beijing.volces.com/api/v3
    apiKey: ${DOUBAO_API_KEY}
    models: [doubao-pro-32k, doubao-pro-128k, doubao-lite-32k, doubao-seed-1-6]
    weight: 60
    priority: 30
    enabled: true

  - id: kimi-main
    name: 月之暗面 Kimi
    group: A
    provider: openai
    plan: standard
    baseUrl: https://api.moonshot.cn/v1
    apiKey: ${KIMI_API_KEY}
    models: [moonshot-v1-8k, moonshot-v1-32k, moonshot-v1-128k, kimi-k2]
    weight: 60
    priority: 30
    enabled: true

  # ---------------- A 组：Coding / Agent 套餐 ----------------
  # 这类套餐通常是订阅制、带「5 小时 N 次」的配额窗口，
  # 用 windowSec + windowMaxRequests 精确建模，配额耗尽自动冷却到窗口结束。
  - id: glm-coding-plan
    name: 智谱 GLM Coding Plan
    group: A
    provider: openai
    plan: coding
    baseUrl: https://open.bigmodel.cn/api/coding/paas/v4
    apiKey: ${GLM_CODING_API_KEY}
    models: [glm-4.6, glm-4.5, glm-4.5-air]
    weight: 120
    priority: 5            # 套餐不用白不用，优先级最高
    enabled: true
    limits:
      rpm: 0
      tpm: 0
      concurrency: 2
      windowSec: 18000     # 5 小时
      windowMaxRequests: 400
      windowMaxTokens: 0

  - id: kimi-coding-plan
    name: Kimi Agent 套餐
    group: A
    provider: openai
    plan: agent
    baseUrl: https://api.moonshot.cn/v1
    apiKey: ${KIMI_AGENT_API_KEY}
    models: [kimi-k2, moonshot-v1-128k]
    weight: 110
    priority: 6
    enabled: false          # 没买就保持 false，启用前填好 Key
    limits:
      concurrency: 2
      windowSec: 18000
      windowMaxRequests: 300

  # ---------------- B 组：免费 / 随意消耗 ----------------
  - id: siliconflow-free
    name: 硅基流动免费模型
    group: B
    provider: openai
    plan: free
    baseUrl: https://api.siliconflow.cn/v1
    apiKey: ${SILICONFLOW_API_KEY}
    models: [Qwen/Qwen2.5-7B-Instruct, THUDM/glm-4-9b-chat, deepseek-ai/DeepSeek-R1-Distill-Qwen-7B]
    weight: 100
    priority: 50
    enabled: true
    limits:
      rpm: 60

  - id: cloudflare-ai
    name: Cloudflare Workers AI
    group: B
    provider: openai
    plan: free
    baseUrl: https://gateway.ai.cloudflare.com/v1/${CF_ACCOUNT_TAG}/${CF_GATEWAY}/openai
    apiKey: ${CF_API_KEY}
    models: ['@cf/meta/llama-3.1-8b-instruct', '@cf/qwen/qwen1.5-14b-chat-awq']
    weight: 80
    priority: 60
    enabled: false

  - id: ollama-local
    name: 本地 Ollama
    group: B
    provider: openai
    plan: free
    baseUrl: http://127.0.0.1:11434/v1
    apiKey: ollama
    models: [qwen2.5:7b, glm4:9b, deepseek-r1:7b]
    weight: 100
    priority: 40
    enabled: false
    limits:
      concurrency: 2

  # ---------------- C 组：高配置（贵，控本）----------------
  - id: openai-main
    name: OpenAI 高配
    group: C
    provider: openai
    plan: standard
    baseUrl: https://api.openai.com/v1
    apiKey: ${OPENAI_API_KEY}
    models: [gpt-4o, gpt-4.1, o1, o3, o3-mini]
    weight: 100
    priority: 10
    enabled: true
    limits:
      rpm: 20
      tpm: 200000
      concurrency: 4

  - id: anthropic-main
    name: Anthropic 高配
    group: C
    provider: anthropic
    plan: standard
    baseUrl: https://api.anthropic.com/v1
    apiKey: ${ANTHROPIC_API_KEY}
    models: [claude-opus-4, claude-opus-4-1, claude-sonnet-4, claude-sonnet-4-5, claude-3-5-haiku]
    weight: 100
    priority: 10
    enabled: true
    limits:
      rpm: 20
      tpm: 200000
      concurrency: 4

  - id: gemini-main
    name: Google Gemini 高配
    group: C
    provider: gemini
    plan: standard
    baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
    apiKey: ${GEMINI_API_KEY}
    models: [gemini-2.5-pro, gemini-2.5-flash]
    weight: 80
    priority: 20
    enabled: false

# -----------------------------------------------------------------------------
# 模型 → 组 的显式路由（可选）
#
# 注意：写进 routes 等同于「显式声明该模型属于这个组」，会绕过 requireExplicit。
# 所以 C 组模型默认**不要**写进来 —— 不写时，请求 gpt-4o 会因为 A/B 组渠道
# 的 models 列表里没有它而返回 503，强制你显式指定（X-GW-Group: C 或 c:gpt-4o）。
# 这正是「防止一次误调用烧掉预算」的兜底。
#
# 只有当你确认「调 gpt-4o 就该走 C 组、预算我心里有数」时，才取消下面的注释。
# -----------------------------------------------------------------------------
routes: {}
#  gpt-4o: [C]
#  o1: [C]
#  claude-opus-4: [C]
#  claude-sonnet-4: [C]
#
# 反过来，想把某个模型钉死在便宜组也行：
#  deepseek-chat: [A]

# -----------------------------------------------------------------------------
# 客户端令牌（可选）
# 留空 = 不鉴权，任何能访问端口的人都能用（仅建议本机/内网这样配）
# 配了就必须带 Authorization: Bearer <key>
# -----------------------------------------------------------------------------
tokens: []
#  - key: sk-gw-local-dev
#    name: dev-local
#    allowGroups: [A, B, C]
#    allowModels: []          # 留空 = 不限制
#    denyModels: []
#    limits:
#      rpm: 0
#      tpm: 0
#      concurrency: 0
#      dailyUSD: 0            # 0 = 不限制
#      monthlyUSD: 0

# -----------------------------------------------------------------------------
# 价格表覆盖（USD / 每 100 万 token）
# 内置了一批常见模型的参考价，但厂商随时调价，请按你的实际账单价校准。
# 只写需要覆盖的即可，没写的走内置表。
# -----------------------------------------------------------------------------
pricing: {}
#  deepseek-chat:
#    in: 0.27
#    out: 1.1
#    cache: 0.07
#  gpt-4o:
#    in: 2.5
#    out: 10
